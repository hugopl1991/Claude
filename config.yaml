# =============================================================================
# - CAMINHOS DOS ARQUIVOS
# =============================================================================
Paths:
  # pastas
  out_dir: "output" # Diretório de saída para os arquivos processados-(OBRIGATORIO).
  tmp_dir: tmp     # Diretório de saída para os arquivos temporarios-(OBRIGATORIO).
  # mapbiomas e shapefiles
  lulc_path: "inputs/mapbiomas_col10/mapbiomas_col10_{AREA}_{YEAR}.tif" # Caminho para o arquivo raster de uso e cobertura da terra (LULC)-(OBRIGATORIO).
  state_shp_path: "inputs/Shape_estados/{AREA}_Mapbiomas.shp" # Caminho para o arquivo shapefile do estado-(OBRIGATORIO).
  aio_shp_path: inputs/Shapes_ADAIMO_2025/ADAIMO_2025_{AREA}.shp # Caminho para o arquivo shapefile de area operacional (AOI)-(OBRIGATORIO).
  # script burn frequencia
  in_burn_dir: "inputs/MODIS_BurnDate_RAW"                   # Diretório de entrada contendo os arquivos raster MODIS BurnDate_*.tif-(OBRIGATORIO).
  out_burn_freq: "burn_frequency_para_{SYERAR}_{EYERAR}.tif" # Nome do arquivo raster de saida com a frequencia das queimadas-(OBRIGATORIO).
  raster_modis: "BurnDate_*.tif"                        # Nome do arquivo raster MODIS (padrão: BurnDate_*.tif)-(OBRIGATORIO).
  # script condicoes de queimadas
  out_reproj: "burn_reproj_temp.tif"                # Caminho para o arquivo raster reprojetado (temporário)-(OBRIGATORIO).
  out_weight_burn: "map_cond_burn_{AREA}_{YEAR}.tif"      # Caminho para o arquivo raster de condição de queimadas (Estado)-(OBRIGATORIO).
  out_clip_burn: "map_cond_burn_{AREA}_{YEAR}_clip.tif" # Caminho para o arquivo raster de condição de queimadas recortado pelo shapefile (AIO) -- Desativado no script
  tabela_csv: "inputs/Planilhas/tabela_queimadas.csv"      # Caminho para o arquivo CSV contendo a tabela de classes de condição de queimadas-(OBRIGATORIO).
  # script condicoes de borda
  out_weight_edge: "map_cond_edge_{AREA}_{YEAR}.tif"      # Caminho para o arquivo raster de condição de borda (Estado)-(OBRIGATORIO).
  out_clip_edge: "map_cond_edge_{AREA}_{YEAR}_clip.tif" # Caminho para o arquivo raster de condição de borda recortado pelo shapefile (AIO) -- Desativado no script
  mask_temp: "temp_shape_mask.tif"                  # Caminho para o arquivo raster temporário de máscara do shapefile (temporário)-(OBRIGATORIO).
  # script condicoes de vegetacao segundaria
  sec_veg_map_file: "inputs/Flor_Sec_col10/raster_Sec_Veg_col10_{AREA}_{YEAR}.tif"  # Caminho para o arquivo raster da vegetação segundaria-(OBRIGATORIO).
  sec_veg_weight_map_file: "veg_sec_weight_{AREA}_{YEAR}.tif"                # Caminho para o arquivo raster de condição da vegetação segundaria (AIO)-(OBRIGATORIO).
  # script NoNetLoss
  lulc_mask_temp: "mapbiomas_{AREA}_{YEAR}_temp.tif" # Caminho para o arquivo raster de uso e cobertura da terra (LULC) temporário-(OBRIGATORIO).
  bv_map_file: "map_biotic_value_{AREA}_{YEAR}.tif"                   # Caminho para o arquivo raster de BV values -(OBRIGATORIO).
  bv_final_map_file: "map_biotic_value_final_{AREA}_{YEAR}.tif"       # Caminho para o arquivo raster de BV values final -(OBRIGATORIO).
  biotic_value_table: "inputs/Planilhas/mapbiomas_id_bv.csv"          # Tabela MapBiomas -> BV (colunas id_class,bv).
  rad_shape_file: "inputs/Shapes_rad/Veg_RAD_{AREA}_{YEAR}.shp"             # Único shape RAD; rasterizado no grid do MapBiomas.
  rad_mask_name: "map_rad_mask_{AREA}_{YEAR}.tif"                     # Nome do arquivo raster da máscara de RAD aplicado reclassificação.
  milhao_map_file_base: map_weights_milhao_{BASE_YEAR}.tif     # Caminho para o mapa de condicao ano base-(OBRIGATORIO).
  milhao_map_file_end: map_weights_milhao_{END_YEAR}.tif       # Caminho para o mapa de condicao ano final-(OBRIGATORIO).
  # script de condicoes do ecossistema
  fito_map_file: "inputs/Fitofisionomia/Brasil_vege_areaWGS84.shp"    # Caminho para o arquivo shapefile das fitofisionomias-(OBRIGATORIO).
  bioma_map_file: "inputs_indicadores/inputs/Biomas/{BIOMA}.shp"      # Caminho para o shape de biomas-(OBRIGATORIO).
  condition_map_file_base: map_weights_100_{BASE_YEAR}.tif     # Caminho para o mapa de condicao ano base-(OBRIGATORIO).
  condition_map_file_end: map_weights_100_{END_YEAR}.tif       # Caminho para o mapa de condicao ano final-(OBRIGATORIO).
  area_map_file: "inputs/Mapa_Area/pxA_x10m2_sembuffer.tif"           # Caminho para o mapa de area-(OBRIGATORIO).
  opunit_id_csv_file: "inputs/Planilhas/OpUnit_ID_2025.csv"             # Arquivo csv contendo os IDs de cada unidade operacional-(OBRIGATORIO).
  opunit_id_map_file: "inputs/Mapas_OpUnit_2025/ADAimo_{AREA}_2025.tif" # Diretorio do mapa de IDs de cada unidade operacional-(OBRIGATORIO).
  opunit_metadata_file: "inputs/Planilhas/OpUnit_Lista_2025.csv"        # Arquivo csv contendo os metadados de cada unidade operacional-(OBRIGATORIO).
  legendas_file: "inputs/Planilhas/Dicionario.xlsx"                     # Arquivo xlsx com as legendas de LULC, Fitofisionomia, Queimadas Pixels de Borda-(OBRIGATORIO).
  file_table_comparison: "lulc_condicao_legenda_{AREA}.xlsx"     # Tabela de comparação de LULC e Condição-(OBRIGATORIO).
  file_table_comparison_csv: "lulc_condicao_legenda_{AREA}.csv"  # Tabela de comparação de LULC e Condição-(OBRIGATORIO).
  bv_final_map_file_base: "map_biotic_value_final_{AREA}_{BASE_YEAR}.tif" # Caminho para o arquivo raster de BV values final ano base -(OBRIGATORIO).
  bv_final_map_file_end: "map_biotic_value_final_{AREA}_{END_YEAR}.tif"   # Caminho para o arquivo raster de BV values final ano final -(OBRIGATORIO).
  # script de GRI_106_107
  file_reclass_path: "inputs/Planilhas/Reclass_{AREA}.xlsx"            # Tabela de reclassificação de LULC e Condição-(OBRIGATORIO).
  output_g106: "Saida1016_{AREA}.csv"                           # Caminho para o arquivo CSV de saída do GRI 106-(OBRIGATORIO).
  output_g107: "Saida1017b_{AREA}.csv"                          # Caminho para o arquivo CSV de saída do GRI 107-(OBRIGATORIO).
  output_lulc_cond: "lulc_condicao_reclass_{AREA}.csv"          # Caminho para o arquivo CSV de saída da tabela de LULC e Condição reclassificada-(OBRIGATORIO).
  output_balance: "Saida_balanco_natural_{AREA}.csv"            # Caminho para o arquivo CSV de saída do balanço natural-(OBRIGATORIO).
  output_bv_balance: "Saida_balanco_BV_{AREA}.csv"              # Caminho para o arquivo CSV de saída do balanço de BV-(OBRIGATORIO).

# =============================================================================
# - VARIÁVEIS
# =============================================================================
Data:
  # Variaveis globais
  area: "PA"       # Estado de interesse - Ex: PA -(OBRIGATORIO).
  start_year: 2000 # Ano inicial para o cálculo da frequência de queimadas -(OBRIGATORIO).
  end_year: 2024   # Ano final para o processamento, usado em todos os scripts -(OBRIGATORIO).
  base_year_veg: 1985  # Ano base usado no script de vegetacao segundaria -(OBRIGATORIO).
  base_year_compare: 2020 # Ano final para o processamento, usado em comparacao de condicoes -(OBRIGATORIO).
  # Variaveis usadas pelos script burn frq, queimadas e bordas
  max_ram_usage: 0.6  # Porcentagem máxima de uso de RAM (0.6 = 60%)
  nodata: -9999       # Nodata (Alterado para valores negativo). NÃO USAR ZERO AQUI - Condicao de borda apresenta valores negativos no raster.
  byte_pixel: 50      # Tamanho do pixel em bytes (usado para estimar o uso de RAM)
  blocksize: 256      # Tamanho do bloco
  tile_size_min: 4096 # Pixels por lado de cada tile (usado para otimizar o processamento em tiles)
  compresssion: "lzw" # Tipo de compressão para os arquivos de saída (usado nos scripts de queimadas e borda)
  tiled: true         # Se True, os arquivos de saída serão salvos em formato tiled (usado nos scripts de queimadas e borda)
  all_touched: true   # Se True, considera todos os pixels tocados pelo polígono; se False, apenas os pixels cujo centro está dentro do polígono (Variavel usada nos 3 scripts citados).
  # Variaveis usadas pelo script burn frq
  tolerance: 0.0001     # Tolerância para simplificação da geometria do shapefile (em graus)
  crs_corr: "EPSG:4326" # Sistema de referência de coordenadas (CRS)
  # Variaveis usadas pelo script borda
  classes_naturais: [0, 3, 4, 5, 6, 11, 12, 23, 29, 32, 33] # Classes de uso e cobertura da terra (LULC) consideradas naturais (sem efeito de borda), ZERO - area classificadas sem dados pelo Mapbiomas -(OBRIGATORIO).
  overlap: 100          # Sobreposição em pixels para o recorte do shapefile (usado para evitar bordas vazias)
  cond_borda: 30        # Condicao de borda inicial (para cálculo da condição)
  size_pixel: 30        # Tamanho do pixel em metros (para cálculo da condição)
  dist_max_pixel: 100   # Valor máximo da condição de borda (para cálculo da condição)
  dist_max_metros: 1000 # Distância máxima do efeito de borda em metros (para cálculo da condição)
  funcao: "linear"      # "linear"  ou "exponencial" --- VERSAO BETA (EXPONENCIAL) - não troque
  # Variaveis usadas pelo script vegetação segundaria
  id_class_veg: 3         # Id da classe vegetal.
  all_touched_veg: false  # Opção all_touched do rasterio para script de vegetação segundaria
  # Variaveis usadas pelo script condicao dos ecossistemas
  id_class_cond: [3, 6]   # Classes selecionadas do LULC -(OBRIGATORIO).
  all_touched_cond: false # Opção all_touched do rasterio para script de condicao dos ecossistemas
  nodata_cond: 0          # Nodata - após a algebra de raster que modifica os valores de pixel, pode ser usar o valor Zero para pixel sem dados.
  # script NoNetLoss
  biotic_value_nodata: 0        # NoData das saídas int8 (valores válidos: 1-100).
  axis_min_bv: 1                # Valor mínimo da escala do raster BV.
  axis_max_bv: 100              # Valor máximo da escala do raster BV.  
  rad_bv_value: 20.83           # BV fixo para substituir o valor penalizado nas áreas de RAD (escala 1-100).
  rad_coverage_threshold: 0.5   # Cobertura mínima estimada da RAD por pixel para reclassificação (50%).
  condition_scale: 1000000.0        # Normalizador do mapa map_weights_100 (escala 1-100).
  lulc_nodata_classes: [0]        # Classes MapBiomas sem dados, não valoradas.
  # script de comparacao de condicoes
  n_condition_classes: 5     # numero de classes de condicao -(OBRIGATORIO).
  id_class_compare: 3        # Classes selecionadas -(OBRIGATORIO).
  all_touched_compare: false # Opção all_touched do rasterio para script de comparacao de condicoes
  # script de GRI_106_107
  decimal_separator: "," # Separador decimal para os arquivos CSV de saída ("," ou ".")
  separator: ";"         # Separador de campo para os arquivos CSV de saída (";" ou ",")
  float_format: "%.5f"   # Formato de ponto flutuante para os arquivos CSV de saída (ex: "%.2f" para duas casas decimais)
